<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0b1520"/>
      <stop offset="100%" style="stop-color:#1a2540"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8b84b"/>
      <stop offset="100%" style="stop-color:#f5d070"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Diagonal rule lines -->
  <g stroke="#e8b84b" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="630" x2="630" y2="0"/>
    <line x1="200" y1="630" x2="830" y2="0"/>
    <line x1="400" y1="630" x2="1030" y2="0"/>
    <line x1="600" y1="630" x2="1200" y2="30"/>
    <line x1="800" y1="630" x2="1200" y2="230"/>
  </g>

  <!-- LAW watermark -->
  <text x="600" y="390" font-family="system-ui, sans-serif" font-size="180" font-weight="900"
        fill="#e8b84b" fill-opacity="0.04" text-anchor="middle">LAW</text>

  <!-- Matter classification stack (right) -->
  <g transform="translate(880, 300)">
    <rect x="-140" y="-130" width="280" height="46" rx="4" fill="#e8b84b" fill-opacity="0.10" stroke="#e8b84b" stroke-opacity="0.25" stroke-width="1"/>
    <text x="0" y="-101" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#e8b84b" fill-opacity="0.7" text-anchor="middle" letter-spacing="0.12em">PRIVILEGED — A/C</text>

    <rect x="-140" y="-76" width="280" height="46" rx="4" fill="#e8b84b" fill-opacity="0.06" stroke="#e8b84b" stroke-opacity="0.15" stroke-width="1"/>
    <text x="0" y="-47" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#e8b84b" fill-opacity="0.5" text-anchor="middle" letter-spacing="0.12em">WORK PRODUCT</text>

    <rect x="-140" y="-22" width="280" height="46" rx="4" fill="#e8b84b" fill-opacity="0.03" stroke="#e8b84b" stroke-opacity="0.10" stroke-width="1"/>
    <text x="0" y="7" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#e8b84b" fill-opacity="0.35" text-anchor="middle" letter-spacing="0.12em">CONFIDENTIAL — CLIENT</text>

    <rect x="-140" y="32" width="280" height="46" rx="4" fill="none" stroke="#e8b84b" stroke-opacity="0.08" stroke-width="1"/>
    <text x="0" y="61" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#e8b84b" fill-opacity="0.25" text-anchor="middle" letter-spacing="0.12em">INTERNAL — FIRM</text>

    <!-- ABA label -->
    <text x="0" y="120" font-family="system-ui, sans-serif" font-size="10" fill="#e8b84b" fill-opacity="0.4" text-anchor="middle" letter-spacing="0.1em">ABA MODEL RULE 1.6  ·  MATTER-CENTRIC</text>
  </g>

  <!-- Gold accent bar -->
  <rect x="100" y="160" width="3" height="60" fill="url(#gold)"/>

  <!-- Category label -->
  <text x="118" y="182" font-family="system-ui, sans-serif" font-size="11" font-weight="700"
        fill="#e8b84b" letter-spacing="0.2em">DATA GOVERNANCE</text>

  <!-- Main headline -->
  <text x="118" y="235" font-family="Georgia, serif" font-size="38" font-weight="700"
        fill="#ffffff" fill-opacity="0.95">Data Governance</text>
  <text x="118" y="283" font-family="Georgia, serif" font-size="38" font-weight="700"
        fill="#ffffff" fill-opacity="0.95">for Law Firms</text>

  <!-- Gold underline -->
  <rect x="118" y="298" width="340" height="2" fill="url(#gold)" fill-opacity="0.6"/>

  <!-- Subtitle -->
  <text x="118" y="340" font-family="system-ui, sans-serif" font-size="16" fill="#ffffff" fill-opacity="0.55">
    ABA Rule 1.6 · Privilege Classification · AI Governance · Retention
  </text>

  <!-- Centience wordmark -->
  <text x="118" y="560" font-family="system-ui, sans-serif" font-size="13" font-weight="600"
        fill="#e8b84b" fill-opacity="0.7" letter-spacing="0.15em">CENTIENCE.AI</text>
</svg>
