<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Centience AI Governance Operating Model — Seven Modules">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1629"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#e8c97a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2e52" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#141f3a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Grid texture -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#c9a84c" stroke-width="0.5" opacity="0.08"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Gold top accent bar -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#goldGrad)"/>

  <!-- Left column: headline block -->
  <rect x="60" y="80" width="4" height="60" fill="url(#goldGrad)" rx="2"/>

  <text x="84" y="114" font-family="Georgia, serif" font-size="13" font-weight="600" fill="#c9a84c" letter-spacing="3" text-anchor="start">AI GOVERNANCE</text>
  <text x="84" y="134" font-family="Georgia, serif" font-size="13" font-weight="600" fill="#c9a84c" letter-spacing="3" opacity="0.6" text-anchor="start">OPERATING MODEL</text>

  <text x="60" y="195" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#f0e8d0" text-anchor="start">How Centience Builds</text>
  <text x="60" y="252" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#f0e8d0" text-anchor="start">AI Governance for</text>
  <text x="60" y="309" font-family="Georgia, serif" font-size="46" font-weight="700" fill="url(#goldGrad)" text-anchor="start">Regulated Firms</text>

  <text x="60" y="368" font-family="Georgia, serif" font-size="17" fill="#a0aec0" text-anchor="start">Seven modules. Built around visibility, ownership,</text>
  <text x="60" y="392" font-family="Georgia, serif" font-size="17" fill="#a0aec0" text-anchor="start">supervision, evidence, and continuous control.</text>

  <!-- Divider -->
  <line x1="60" y1="426" x2="340" y2="426" stroke="#c9a84c" stroke-width="1" opacity="0.3"/>

  <text x="60" y="458" font-family="Georgia, serif" font-size="14" fill="#c9a84c" opacity="0.8" text-anchor="start">100% audit success rate — SEC, FINRA, HIPAA</text>

  <!-- LinkedIn badge -->
  <rect x="60" y="498" width="160" height="36" rx="6" fill="#0077B5" opacity="0.9"/>
  <text x="140" y="521" font-family="Georgia, serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Read on LinkedIn →</text>

  <!-- Right column: 7 module cards -->
  <!-- Module 1 -->
  <rect x="540" y="60" width="290" height="72" rx="10" fill="url(#cardGrad)" stroke="#c9a84c" stroke-width="0.5" stroke-opacity="0.3"/>
  <rect x="540" y="60" width="4" height="72" rx="2" fill="url(#goldGrad)"/>
  <text x="560" y="92" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#c9a84c" letter-spacing="2">01 — VISIBILITY</text>
  <text x="560" y="112" font-family="Georgia, serif" font-size="13" fill="#d4cfc7">AI Usage Discovery</text>

  <!-- Module 2 -->
  <rect x="540" y="146" width="290" height="72" rx="10" fill="url(#cardGrad)" stroke="#c9a84c" stroke-width="0.5" stroke-opacity="0.3"/>
  <rect x="540" y="146" width="4" height="72" rx="2" fill="url(#goldGrad)"/>
  <text x="560" y="178" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#c9a84c" letter-spacing="2">02 — OWNERSHIP</text>
  <text x="560" y="198" font-family="Georgia, serif" font-size="13" fill="#d4cfc7">Policy &amp; Framework Development</text>

  <!-- Module 3 -->
  <rect x="540" y="232" width="290" height="72" rx="10" fill="url(#cardGrad)" stroke="#c9a84c" stroke-width="0.5" stroke-opacity="0.3"/>
  <rect x="540" y="232" width="4" height="72" rx="2" fill="url(#goldGrad)"/>
  <text x="560" y="264" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#c9a84c" letter-spacing="2">03 — SUPERVISION</text>
  <text x="560" y="284" font-family="Georgia, serif" font-size="13" fill="#d4cfc7">AI Risk Assessment</text>

  <!-- Module 4 -->
  <rect x="540" y="318" width="290" height="72" rx="10" fill="url(#cardGrad)" stroke="#c9a84c" stroke-width="0.5" stroke-opacity="0.3"/>
  <rect x="540" y="318" width="4" height="72" rx="2" fill="url(#goldGrad)"/>
  <text x="560" y="350" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#c9a84c" letter-spacing="2">04 — EVIDENCE</text>
  <text x="560" y="370" font-family="Georgia, serif" font-size="13" fill="#d4cfc7">Continuous Documentation</text>

  <!-- Module 5 -->
  <rect x="540" y="404" width="290" height="72" rx="10" fill="url(#cardGrad)" stroke="#c9a84c" stroke-width="0.5" stroke-opacity="0.3"/>
  <rect x="540" y="404" width="4" height="72" rx="2" fill="url(#goldGrad)"/>
  <text x="560" y="436" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#c9a84c" letter-spacing="2">05 — MONITORING</text>
  <text x="560" y="456" font-family="Georgia, serif" font-size="13" fill="#d4cfc7">Ongoing AI Monitoring</text>

  <!-- Module 6 -->
  <rect x="850" y="60" width="290" height="72" rx="10" fill="url(#cardGrad)" stroke="#c9a84c" stroke-width="0.5" stroke-opacity="0.3"/>
  <rect x="850" y="60" width="4" height="72" rx="2" fill="url(#goldGrad)"/>
  <text x="870" y="92" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#c9a84c" letter-spacing="2">06 — REPORTING</text>
  <text x="870" y="112" font-family="Georgia, serif" font-size="13" fill="#d4cfc7">Board &amp; Exec Reporting</text>

  <!-- Module 7 -->
  <rect x="850" y="146" width="290" height="72" rx="10" fill="url(#cardGrad)" stroke="#c9a84c" stroke-width="0.5" stroke-opacity="0.3"/>
  <rect x="850" y="146" width="4" height="72" rx="2" fill="url(#goldGrad)"/>
  <text x="870" y="178" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#c9a84c" letter-spacing="2">07 — IMPLEMENTATION</text>
  <text x="870" y="198" font-family="Georgia, serif" font-size="13" fill="#d4cfc7">AI Deployment &amp; Integration</text>

  <!-- Audit result callout -->
  <rect x="850" y="260" width="290" height="220" rx="12" fill="#c9a84c" fill-opacity="0.08" stroke="#c9a84c" stroke-width="1" stroke-opacity="0.4"/>
  <text x="995" y="302" font-family="Georgia, serif" font-size="52" font-weight="700" fill="url(#goldGrad)" text-anchor="middle">100%</text>
  <text x="995" y="336" font-family="Georgia, serif" font-size="14" fill="#c9a84c" text-anchor="middle" font-weight="600">AUDIT SUCCESS RATE</text>
  <line x1="890" y1="355" x2="1100" y2="355" stroke="#c9a84c" stroke-width="0.5" opacity="0.4"/>
  <text x="995" y="378" font-family="Georgia, serif" font-size="12" fill="#a0aec0" text-anchor="middle">Every SEC engagement</text>
  <text x="995" y="398" font-family="Georgia, serif" font-size="12" fill="#a0aec0" text-anchor="middle">Every FINRA examination</text>
  <text x="995" y="418" font-family="Georgia, serif" font-size="12" fill="#a0aec0" text-anchor="middle">Every HIPAA audit</text>
  <text x="995" y="450" font-family="Georgia, serif" font-size="11" fill="#c9a84c" text-anchor="middle" opacity="0.7">Not from paperwork —</text>
  <text x="995" y="468" font-family="Georgia, serif" font-size="11" fill="#c9a84c" text-anchor="middle" opacity="0.7">from an operating model.</text>

  <!-- Centience wordmark -->
  <text x="60" y="598" font-family="Georgia, serif" font-size="13" font-weight="600" fill="#c9a84c" opacity="0.6" letter-spacing="3">CENTIENCE.AI</text>
</svg>
