<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1a"/>
      <stop offset="100%" style="stop-color:#12101e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8b84b"/>
      <stop offset="100%" style="stop-color:#f5d070"/>
    </linearGradient>
    <linearGradient id="amber-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8b84b"/>
      <stop offset="100%" style="stop-color:#e8714b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.04" stroke="#e8b84b" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Shadow figure (left side visual) — stylized silhouette using AI tool -->
  <g transform="translate(60, 100)" opacity="0.15">
    <!-- Shadow person silhouette -->
    <ellipse cx="90" cy="60" rx="30" ry="30" fill="#e8b84b"/>
    <rect x="60" y="95" width="60" height="90" rx="8" fill="#e8b84b"/>
    <rect x="40" y="100" width="25" height="70" rx="6" fill="#e8b84b"/>
    <rect x="95" y="100" width="25" height="70" rx="6" fill="#e8b84b"/>
    <rect x="55" y="185" width="25" height="80" rx="6" fill="#e8b84b"/>
    <rect x="80" y="185" width="25" height="80" rx="6" fill="#e8b84b"/>
  </g>

  <!-- Glowing orb / AI node -->
  <circle cx="160" cy="200" r="55" fill="none" stroke="#e8b84b" stroke-width="1" stroke-opacity="0.2"/>
  <circle cx="160" cy="200" r="35" fill="none" stroke="#e8b84b" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="160" cy="200" r="18" fill="#e8b84b" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="160" cy="200" r="8" fill="#e8b84b" fill-opacity="0.6"/>

  <!-- Connection lines from orb to data cards -->
  <line x1="195" y1="200" x2="640" y2="130" stroke="#e8b84b" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="6,4"/>
  <line x1="195" y1="200" x2="640" y2="260" stroke="#e8b84b" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="6,4"/>
  <line x1="195" y1="200" x2="640" y2="390" stroke="#e8b84b" stroke-width="1" stroke-opacity="0.1" stroke-dasharray="6,4"/>

  <!-- LEFT SIDE — Headline text -->
  <text x="60" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e8b84b" letter-spacing="3" text-transform="uppercase">AI GOVERNANCE</text>

  <text x="60" y="380" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#f7f4ef">One Employee.</text>
  <text x="60" y="418" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#f7f4ef">One Unauthorized</text>
  <text x="60" y="456" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#f7f4ef">AI Tool. One SEC Filing.</text>

  <text x="60" y="498" font-family="system-ui, sans-serif" font-size="14" fill="#f7f4ef" fill-opacity="0.5">Shadow AI Is No Longer a Theoretical Risk.</text>

  <!-- Centience wordmark bottom-left -->
  <text x="60" y="580" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#e8b84b" letter-spacing="2">CENTIENCE</text>
  <text x="60" y="600" font-family="system-ui, sans-serif" font-size="11" fill="#f7f4ef" fill-opacity="0.35">centience.ai · AI &amp; Technology Governance · June 2026</text>

  <!-- RIGHT SIDE — Data cards -->

  <!-- Card 1: CB Financial 8-K -->
  <rect x="640" y="70" width="510" height="110" rx="8" fill="#0f1520" stroke="#e8714b" stroke-opacity="0.35" stroke-width="1"/>
  <rect x="640" y="70" width="4" height="110" rx="2" fill="#e8714b" fill-opacity="0.9"/>
  <text x="664" y="102" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f7f4ef">CB Financial Services — May 2026</text>
  <text x="664" y="124" font-family="system-ui, sans-serif" font-size="11" fill="#f7f4ef" fill-opacity="0.5">First-ever SEC Form 8-K triggered by shadow AI</text>
  <text x="664" y="148" font-family="system-ui, sans-serif" font-size="11" fill="#f7f4ef" fill-opacity="0.4">One employee · One unauthorized AI tool · Non-public customer data exposed</text>
  <text x="1130" y="124" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#e8714b" text-anchor="end">Item 1.05</text>

  <!-- Card 2: $4.63M breach cost -->
  <rect x="640" y="200" width="510" height="110" rx="8" fill="#0f1520" stroke="#e8b84b" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="640" y="200" width="4" height="110" rx="2" fill="#e8b84b" fill-opacity="0.9"/>
  <text x="664" y="232" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f7f4ef">IBM Cost of a Data Breach Report 2025</text>
  <text x="664" y="254" font-family="system-ui, sans-serif" font-size="11" fill="#f7f4ef" fill-opacity="0.5">Average shadow AI breach cost vs. standard breach</text>
  <text x="664" y="278" font-family="system-ui, sans-serif" font-size="11" fill="#f7f4ef" fill-opacity="0.4">+$670K premium per incident for unsanctioned AI tools</text>
  <text x="1130" y="260" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#e8b84b" text-anchor="end">$4.63M</text>

  <!-- Card 3: 80% stat -->
  <rect x="640" y="330" width="240" height="100" rx="8" fill="#0f1520" stroke="#e8b84b" stroke-opacity="0.2" stroke-width="1"/>
  <rect x="640" y="330" width="4" height="100" rx="2" fill="#e8b84b" fill-opacity="0.5"/>
  <text x="664" y="362" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#e8b84b">80%+</text>
  <text x="664" y="386" font-family="system-ui, sans-serif" font-size="11" fill="#f7f4ef" fill-opacity="0.5">of workers globally use</text>
  <text x="664" y="404" font-family="system-ui, sans-serif" font-size="11" fill="#f7f4ef" fill-opacity="0.5">unapproved AI tools at work</text>

  <!-- Card 4: 17% stat -->
  <rect x="910" y="330" width="240" height="100" rx="8" fill="#0f1520" stroke="#e8b84b" stroke-opacity="0.2" stroke-width="1"/>
  <rect x="910" y="330" width="4" height="100" rx="2" fill="#e8714b" fill-opacity="0.5"/>
  <text x="934" y="362" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#e8714b">17%</text>
  <text x="934" y="386" font-family="system-ui, sans-serif" font-size="11" fill="#f7f4ef" fill-opacity="0.5">have technical controls</text>
  <text x="934" y="404" font-family="system-ui, sans-serif" font-size="11" fill="#f7f4ef" fill-opacity="0.5">to block unauthorized AI</text>

  <!-- Card 5: Healthcare cost -->
  <rect x="640" y="450" width="510" height="100" rx="8" fill="#0f1520" stroke="#e8b84b" stroke-opacity="0.2" stroke-width="1"/>
  <rect x="640" y="450" width="4" height="100" rx="2" fill="#e8b84b" fill-opacity="0.4"/>
  <text x="664" y="482" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f7f4ef">Healthcare — Highest Breach Cost, 14th Consecutive Year</text>
  <text x="664" y="504" font-family="system-ui, sans-serif" font-size="11" fill="#f7f4ef" fill-opacity="0.5">Average security breach cost in healthcare (2025)</text>
  <text x="664" y="526" font-family="system-ui, sans-serif" font-size="11" fill="#f7f4ef" fill-opacity="0.4">Only 35% visibility into AI data flows · HIPAA BAA exposure</text>
  <text x="1130" y="504" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#e8b84b" text-anchor="end">$7.4M+</text>

  <!-- Divider line -->
  <line x1="60" y1="320" x2="560" y2="320" stroke="#e8b84b" stroke-width="1" stroke-opacity="0.15"/>
</svg>
